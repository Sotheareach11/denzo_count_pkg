<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PKG Counter - Packing List Tool</title>
    <style>
      body {
        font-family: "Segoe UI", Arial, sans-serif;
        background: #f4f6fa;
        margin: 0;
        padding: 40px 20px;
        color: #222;
      }
      .card {
        max-width: 720px;
        margin: 0 auto;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
        padding: 32px;
      }
      .top-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 4px;
      }
      h1 {
        font-size: 22px;
        margin-bottom: 4px;
        color: #1f2d4d;
      }
      a.tool-link {
        font-size: 13px;
        color: #305496;
        text-decoration: none;
        border: 1px solid #305496;
        border-radius: 6px;
        padding: 6px 12px;
        white-space: nowrap;
      }
      a.tool-link:hover {
        background: #305496;
        color: #fff;
      }
      p.subtitle {
        color: #667;
        margin-top: 0;
        margin-bottom: 24px;
      }
      .drop-zone {
        border: 2px dashed #305496;
        border-radius: 10px;
        padding: 24px;
        text-align: center;
        color: #305496;
        background: #f7f9fd;
        cursor: pointer;
      }
      input[type="file"] {
        display: none;
      }
      #fileList {
        margin-top: 12px;
        font-size: 14px;
        color: #333;
      }
      #fileList li {
        margin-bottom: 4px;
      }
      button#countBtn {
        margin-top: 20px;
        width: 100%;
        padding: 12px;
        background: #305496;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        cursor: pointer;
      }
      button#countBtn:disabled {
        background: #9aa8c7;
        cursor: not-allowed;
      }
      #status {
        margin-top: 14px;
        font-size: 14px;
        color: #555;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 14px;
        font-size: 13px;
      }
      th,
      td {
        border: 1px solid #e2e6ee;
        padding: 6px 8px;
        text-align: left;
      }
      th {
        background: #305496;
        color: #fff;
      }
      .pdf-block {
        margin-top: 22px;
      }
      .pdf-block h3 {
        margin-bottom: 6px;
        color: #1f2d4d;
      }
      #downloadBtn {
        display: none;
        margin-top: 20px;
        width: 100%;
        padding: 12px;
        background: #2e8b57;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        text-align: center;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="top-row">
        <h1>Packing List PKG Counter</h1>
        <a class="tool-link" href="combine">Combine PDFs Tool &rarr;</a>
      </div>
      <p class="subtitle">
        Select one or more PDF packing lists, then click "Count PKG". You'll get
        an Excel file with one sheet per PDF, each showing how many times every
        item appears (PKG count).
      </p>

      <div class="drop-zone" id="dropZone">
        Click here to select PDF file(s)
        <input type="file" id="pdfInput" accept="application/pdf" multiple />
      </div>
      <ul id="fileList"></ul>

      <button id="countBtn" disabled>Count PKG</button>
      <div id="status"></div>
      <div
        id="summaryBox"
        style="
          display: none;
          margin-top: 14px;
          padding: 14px 16px;
          background: #eef3fb;
          border: 1px solid #c9d6ec;
          border-radius: 8px;
          font-size: 14px;
        "
      ></div>
      <a id="downloadBtn" href="#">⬇ Download Excel Report</a>

      <div id="results"></div>
    </div>

    <script>
      const dropZone = document.getElementById("dropZone");
      const pdfInput = document.getElementById("pdfInput");
      const fileList = document.getElementById("fileList");
      const countBtn = document.getElementById("countBtn");
      const statusDiv = document.getElementById("status");
      const resultsDiv = document.getElementById("results");
      const downloadBtn = document.getElementById("downloadBtn");

      dropZone.addEventListener("click", () => pdfInput.click());

      pdfInput.addEventListener("change", () => {
        fileList.innerHTML = "";
        const files = Array.from(pdfInput.files);
        files.forEach((f) => {
          const li = document.createElement("li");
          li.textContent = f.name;
          fileList.appendChild(li);
        });
        countBtn.disabled = files.length === 0;
        downloadBtn.style.display = "none";
        resultsDiv.innerHTML = "";
      });

      const summaryBox = document.getElementById("summaryBox");

      function describeHttpError(res, raw, data) {
        if (data && data.error) return data.error;
        if (res.status === 502 || res.status === 504) {
          return "The server took too long or ran out of memory. Try again, or check with the site owner if this keeps happening.";
        }
        if (res.status === 413) {
          return "Upload too large for one batch.";
        }
        if (!raw) {
          return `Server returned an empty response (status ${res.status}). It may have crashed or restarted.`;
        }
        return `Unexpected server response (status ${res.status}).`;
      }

      async function readJsonSafe(res) {
        const raw = await res.text();
        let data = null;
        if (raw) {
          try {
            data = JSON.parse(raw);
          } catch (e) {
            data = null;
          }
        }
        return { raw, data };
      }

      function sleep(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
      }

      async function pollJob(jobId) {
        // Poll every 2 seconds until the background job finishes, fails,
        // or we lose track of it. Each poll is a small, fast request, so
        // none of them can hit a timeout the way one giant upload request
        // did.
        while (true) {
          await sleep(2000);
          const res = await fetch(`/count/status/${jobId}`);
          const { raw, data } = await readJsonSafe(res);

          if (!res.ok || !data) {
            throw new Error(describeHttpError(res, raw, data));
          }

          if (data.status === "processing" || data.status === "queued") {
            const done = data.progress_done || 0;
            const total = data.progress_total || 0;
            const currentFile = data.current_file
              ? ` (${data.current_file})`
              : "";
            statusDiv.textContent =
              total > 0
                ? `Processing ${done}/${total}${currentFile}...`
                : "Processing...";
            continue;
          }

          if (data.status === "error") {
            throw new Error(data.error || "Processing failed.");
          }

          if (data.status === "done") {
            return data;
          }
        }
      }

      countBtn.addEventListener("click", async () => {
        const files = pdfInput.files;
        if (!files.length) return;

        const formData = new FormData();
        for (const f of files) formData.append("pdfs", f);

        countBtn.disabled = true;
        statusDiv.textContent = "Uploading...";
        resultsDiv.innerHTML = "";
        summaryBox.style.display = "none";
        downloadBtn.style.display = "none";

        try {
          // This first request just saves the files and starts a
          // background job - it returns almost immediately, so it won't
          // hit the same timeout that processing a huge batch inline did.
          const startRes = await fetch("/count", {
            method: "POST",
            body: formData,
          });
          const { raw, data: startData } = await readJsonSafe(startRes);

          if (!startRes.ok || !startData) {
            throw new Error(describeHttpError(startRes, raw, startData));
          }

          statusDiv.textContent = `Processing 0/${startData.total_files}...`;
          const data = await pollJob(startData.job_id);

          statusDiv.textContent = "Done!";

          summaryBox.innerHTML =
            `<strong>Totals across all files:</strong><br/>` +
            `PKG: ${data.grand_total_pkg} &nbsp;|&nbsp; ` +
            `Net Weight: ${data.grand_total_nw} kg &nbsp;|&nbsp; ` +
            `Gross Weight: ${data.grand_total_gw} kg`;
          summaryBox.style.display = "block";

          data.preview.forEach((pdf) => {
            const block = document.createElement("div");
            block.className = "pdf-block";
            if (pdf.error) {
              block.innerHTML = `<h3>${pdf.filename}</h3><p style="color:#b91c1c;">Could not process: ${pdf.error}</p>`;
              resultsDiv.appendChild(block);
              return;
            }
            let html = `<h3>${pdf.filename}</h3><table><tr><th>Item No.</th><th>Description</th><th>PKG (Count)</th><th>Total Qty</th></tr>`;
            pdf.items.forEach((item) => {
              html += `<tr><td>${item.itemno}</td><td>${item.desc}</td><td>${item.pkg}</td><td>${item.qty}</td></tr>`;
            });
            html += `</table>`;
            block.innerHTML = html;
            resultsDiv.appendChild(block);
          });

          downloadBtn.href = "/download/" + data.download_id;
          downloadBtn.style.display = "block";
        } catch (err) {
          statusDiv.textContent = "Error: " + err.message;
        } finally {
          countBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
